# =============================================================
# blog-web-v2 Demo Docker Compose
#
# 用途：展示 blog-web-v2 所需的基礎設施服務（純參考範例）
# =============================================================

services:

  # PostgreSQL — main database
  postgres:
    image: postgres:18-alpine
    container_name: blog-demo-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: blog_v2_db
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo}
    volumes:
      - blog-demo-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demo} -d blog_v2_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Redis — cache
  redis:
    image: redis:8-alpine
    container_name: blog-demo-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no --requirepass ${REDIS_PASSWORD:-demo}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-demo}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Elasticsearch — full-text search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.4
    container_name: blog-demo-elasticsearch
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=trial
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-demo}
    volumes:
      - blog-demo-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -u elastic:${ELASTIC_PASSWORD:-demo} -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Kibana — ES visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.4
    container_name: blog-demo-kibana
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:-demo}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-demo_encryption_key_min_32_characters_long}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-demo_encryption_key_min_32_characters_long}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-demo_encryption_key_min_32_characters_long}
      - XPACK_FLEET_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-demo_encryption_key_min_32_characters_long}
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # RabbitMQ — message queue
  rabbitmq:
    image: rabbitmq:4.2.2-management
    container_name: blog-demo-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-demo}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-demo}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # MinIO — object storage (S3 compatible)
  minio:
    image: minio/minio:latest
    container_name: blog-demo-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-demo}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-demo1234}
    command: server /data --console-address ":9001"
    volumes:
      - blog-demo-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  blog-demo-pg-data:
  blog-demo-es-data:
  blog-demo-minio-data:
