minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: blog-files

blog:
  file:
    quotas:
      USER: 10MB
      AUTHOR: 500MB
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif

spring:
  data:
    redis:
      host: ${spring.redis.host:localhost}
      port: ${spring.redis.port:6379}
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

# 應用層限流（SEC-23）：RateLimitRuleValidator 要求被掃描到的 @RateLimited 規則都有設定；
# 這裡的 IT 不驗證限流本身，門檻調高到不會觸發。
app:
  rate-limit:
    rules:
      upload:
        limit: 100000
        window: 1m
