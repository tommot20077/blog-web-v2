spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration,classpath:db/testdata
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    use-generated-keys: true
  # 縮小到 model 子 package，避免 T3 期間兩個模組同名 service/repo class 造成 alias 衝突
  type-aliases-package: "dowob.xyz.blog.module.article.model,dowob.xyz.blog.module.reading.model,dowob.xyz.blog.module.comment.model"
  type-handlers-package: dowob.xyz.blog.infrastructure.config

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: test-bucket
