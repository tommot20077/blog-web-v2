server:
  forward-headers-strategy: framework

spring:
  application:
    name: blog-web-v2
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  # Database
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/blogv2}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  # RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:blog}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual

  # SMTP / Transactional Mail
  mail:
    host: ${SPRING_MAIL_HOST:smtp-relay.brevo.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
      "[mail.smtp.connectiontimeout]": ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
      "[mail.smtp.timeout]": ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:5000}
      "[mail.smtp.writetimeout]": ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:5000}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

  # Elasticsearch
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true

# MyBatis 配置
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    use-generated-keys: true
  type-aliases-package: dowob.xyz.blog.module
  type-handlers-package: dowob.xyz.blog.infrastructure.config

# MinIO Config
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:blog-files}

# 檔案模組設定
blog:
  file:
    quotas:
      USER: 10MB
      AUTHOR: 500MB
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# CORS 配置（生產環境同域部署時不觸發，此為開發環境預設）
app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  mail:
    default-from:
      address: ${APP_MAIL_DEFAULT_FROM_ADDRESS:no-reply@90030.xyz}
      name: ${APP_MAIL_DEFAULT_FROM_NAME:Blog}
    security-from:
      address: ${APP_MAIL_SECURITY_FROM_ADDRESS:${APP_MAIL_DEFAULT_FROM_ADDRESS:no-reply@90030.xyz}}
      name: ${APP_MAIL_SECURITY_FROM_NAME:Blog Security Bot}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

# Version 模組設定
version:
  auto:
    enabled: true
    retain: 50
    interval-seconds: 60
    diff-chars: 50

# SpringDoc OpenAPI 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  packages-to-scan: dowob.xyz.blog
  default-flat-param-object: true
