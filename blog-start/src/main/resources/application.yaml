server:
  forward-headers-strategy: framework

spring:
  application:
    name: blog-web-v2
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  # 排程池（findings PERF-16）：預設只有 1 條執行緒，flush／trending 等 fixedDelay job 與
  # 每日孤兒校正 job 會互相等待；孤兒校正框架另有單次頁數上限避免長掃描佔住執行緒。
  task:
    scheduling:
      pool:
        size: 4

  # Database
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/blogv2}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 連線池預算（Z3-b，與下方 spring.rabbitmq.listener.simple 綁定）：
      #   executeIdempotent 的 consumer 在整個 body 期間持有一條 DB 連線（寄信 consumer 的 SMTP 最壞約 15 秒）。
      #   使用 DB 的 @RabbitListener container 共 12 個（見回報），每個 container 最多同時 max-concurrency 條執行緒，
      #   最壞同時佔用 = 12 × max-concurrency = 12 × 2 = 24 條；30 − 24 = 至少 6 條留給 HTTP／排程。
      #   調高 MQ_LISTENER_MAX_CONCURRENCY 時，務必同步調高本值：maximum-pool-size ≥ 12 × max-concurrency + HTTP 預留（≥ 6）。
      #   多副本部署時 DB 總連線 = 副本數 × 本值，需不超過 Postgres max_connections。
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}

  # RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:blog}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        # 並行度（PERF-30）：stateful retry 的退避睡眠發生在 consumer 執行緒上，單一毒訊息會佔住一條執行緒
        # 約 6 秒（1s＋5s）。concurrency ≥ 2 讓同一 queue 的其他訊息由另一條執行緒處理，不被頭部阻塞。
        concurrency: ${MQ_LISTENER_CONCURRENCY:2}
        # 上限刻意等於 concurrency（不自動擴張）：每個 container 的最大並行度受 DB 連線池預算約束（見 hikari 註解）。
        max-concurrency: ${MQ_LISTENER_MAX_CONCURRENCY:2}
        # prefetch=1：退避睡眠中的執行緒只持有「正在重試的那一則」未確認訊息，不會把其他訊息囤在
        # 自己的 prefetch 緩衝裡等睡眠結束（prefetch>1 時緩衝中的訊息會一起被卡住約 6 秒）。
        prefetch: ${MQ_LISTENER_PREFETCH:1}

  # SMTP / Transactional Mail
  mail:
    host: ${SPRING_MAIL_HOST:smtp-relay.brevo.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
      "[mail.smtp.connectiontimeout]": ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
      "[mail.smtp.timeout]": ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:5000}
      "[mail.smtp.writetimeout]": ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:5000}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

  # Elasticsearch
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true

# MyBatis 配置
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    use-generated-keys: true
  type-aliases-package: dowob.xyz.blog.module
  type-handlers-package: dowob.xyz.blog.infrastructure.config

# MinIO Config
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:blog-files}

# 檔案模組設定
blog:
  file:
    quotas:
      USER: 10MB
      AUTHOR: 500MB
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        # metrics 用於觀察 BatchedQuery 的輸入分佈（ARCH-16 的第一步）。
        # 授權面：SecurityConfig 只 permitAll /actuator/health/** 與 /actuator/info，
        # /actuator/metrics 落入 anyRequest().authenticated()（fail-closed），
        # 守衛見 SecurityConfigTest#unauthenticatedGetActuatorMetrics_shouldReturn401。
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# CORS 配置（生產環境同域部署時不觸發，此為開發環境預設）
app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  mail:
    default-from:
      address: ${APP_MAIL_DEFAULT_FROM_ADDRESS:no-reply@90030.xyz}
      name: ${APP_MAIL_DEFAULT_FROM_NAME:Blog}
    security-from:
      address: ${APP_MAIL_SECURITY_FROM_ADDRESS:${APP_MAIL_DEFAULT_FROM_ADDRESS:no-reply@90030.xyz}}
      name: ${APP_MAIL_SECURITY_FROM_NAME:Blog Security Bot}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

# Version 模組設定
version:
  auto:
    enabled: true
    retain: 50
    interval-seconds: 60
    diff-chars: 50

# SpringDoc OpenAPI 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
  packages-to-scan: dowob.xyz.blog
  default-flat-param-object: true
