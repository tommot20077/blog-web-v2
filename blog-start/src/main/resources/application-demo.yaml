# 此檔案用於演示配置結構 (Demo)
# 實際值應由環境變數或 deployment.yaml 注入
#
# demo 屬於非正式 profile（RuntimeProfiles）：基底 application.yaml 不再內建預設憑證（SEC-12），
# 本檔的展示用預設值僅供 demo compose 使用，嚴禁用於正式環境；JWT 私鑰未設時亦只在 demo 等非正式 profile 才會自動產生。

spring:
  application:
    name: blog-web-v2

  # Database
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/blogv2}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}

  # RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # Elasticsearch
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTICSEARCH_PASSWORD:__CHANGE_ME_ELASTIC_PASSWORD__}

# MinIO Config
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:blog-files}
