# dev profile 設定（已納入版控，且不含任何真實憑證）
# 真實的共享基礎設施位址與密碼請用環境變數覆寫（${LOCAL_*} 系列），
# 或放在 gitignored 的 application-local.yaml，切勿把真實憑證寫回本檔。
spring:
  config:
    activate:
      on-profile: dev

  # Database (TimescaleDB)
  # 共享基礎設施埠 Dev: 30120 | Prod: 30220 | Demo Docker: 5432
  datasource:
    url: ${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/blog_v2_db}
    username: ${LOCAL_DB_USERNAME:postgres}
    password: ${LOCAL_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # Redis
  # 共享基礎設施埠 Dev: 30121 | Prod: 30221 | Demo Docker: 6379
  data:
    redis:
      host: ${LOCAL_REDIS_HOST:localhost}
      port: ${LOCAL_REDIS_PORT:6379}
      password: ${LOCAL_REDIS_PASSWORD:}
      database: 0

  # RabbitMQ
  # 共享基礎設施埠 Dev: 30127 (AMQP), 30128 (Management) | Prod: 30227/30228 | Demo Docker: 5672/15672
  rabbitmq:
    host: ${LOCAL_MQ_HOST:localhost}
    port: ${LOCAL_MQ_PORT:5672}
    username: ${LOCAL_MQ_USERNAME:guest}
    password: ${LOCAL_MQ_PASSWORD:guest}
    virtual-host: blog

  # Elasticsearch
  # 共享基礎設施埠 Dev: 30124 | Prod: 30224 | Demo Docker: 9200
  elasticsearch:
    uris: ${LOCAL_ES_URIS:http://localhost:9200}
    username: ${LOCAL_ES_USERNAME:elastic}
    password: ${LOCAL_ES_PASSWORD:}

  # 開發用設定
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# MinIO Config
# 共享基礎設施埠 Dev: 30130 (API), 30131 (Console) | Prod: 30230/30231 | Demo Docker: 9000/9001
minio:
  endpoint: ${LOCAL_MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${LOCAL_MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${LOCAL_MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${LOCAL_MINIO_BUCKET:blog-files}

# JWT Config
jwt:
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: 9010

app:
  mail:
    consumer-enabled: false
