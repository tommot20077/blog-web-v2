# E2E 測試專用配置
# 所有外部服務連線（DB/Redis/RabbitMQ/MinIO/ES）由 @DynamicPropertySource 注入，不在此設定

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    use-generated-keys: true

minio:
  bucket-name: blog-e2e-test

blog:
  file:
    quotas:
      USER: 10MB
      AUTHOR: 500MB
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif

# management port 用隨機 port：同一個 JVM 內會快取多個 Spring context，固定 port 會互相衝突
management:
  server:
    port: 0

app:
  mail:
    consumer-enabled: false
  # 應用層限流（SEC-23）：E2E 全部 MockMvc 請求共用 127.0.0.1 與少數測試帳號，且許多測試短時間內重複呼叫同一端點，
  # 故一般 E2E 把門檻調高到不會觸發；RateLimitE2E 以 @TestPropertySource 還原正式門檻驗證限流本身。
  rate-limit:
    rules:
      comment-write:
        limit: 100000
      interaction-write:
        limit: 100000
      upload:
        limit: 100000
      article-write:
        limit: 100000
      search:
        limit: 100000
